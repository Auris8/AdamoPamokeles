<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563eb">
<title>Skiemenys</title>
<style>
html,body{margin:0;padding:0;background:#fffaf0}
@media (prefers-color-scheme:dark){html,body{background:#1c1b22}}
body{padding:8px;-webkit-tap-highlight-color:transparent}
#skm{max-width:560px;margin:0 auto}
</style>
</head>
<body>
<div id="skm"><style>#skm{--bg:#fffaf0;--card:#ffffff;--tx:#2b2b2b;--mut:#6b6b6b;--c:#2563eb;--v:#e8590c;--ok:#16a34a;--bad:#dc2626;--bd:#e5e1d8;font-family:system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);padding:14px;border-radius:16px;box-sizing:border-box}@media (prefers-color-scheme:dark){#skm{--bg:#1c1b22;--card:#2a2933;--tx:#f3f3f3;--mut:#b5b5b5;--c:#60a5fa;--v:#fb923c;--ok:#4ade80;--bad:#f87171;--bd:#3d3c48}}#skm *{box-sizing:border-box}#skm .tabs{display:flex;gap:8px;margin-bottom:12px}#skm .tab{flex:1;padding:10px;font-size:18px;font-weight:700;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}#skm .tab[aria-selected=true]{border-color:var(--c);background:var(--c);color:#fff}#skm button:focus-visible{outline:3px solid var(--v);outline-offset:2px}#skm .hint{color:var(--mut);margin:4px 0 8px;font-size:15px;text-align:center}#skm .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}#skm .k{min-width:44px;height:44px;font-size:22px;font-weight:800;border-radius:10px;border:2px solid var(--bd);background:var(--card);cursor:pointer}#skm .k.cn{color:var(--c)}#skm .k.vw{color:var(--v)}#skm .k.sel{border-color:currentColor;box-shadow:0 0 0 2px currentColor inset}#skm .stage{display:flex;justify-content:center;align-items:center;gap:40px;height:120px;background:var(--card);border-radius:16px;border:2px solid var(--bd);margin:6px 0 12px;transition:gap .6s}#skm .stage.join{gap:2px}#skm .l{font-size:72px;font-weight:900;line-height:1}#skm .l.c{color:var(--c)}#skm .l.v{color:var(--v)}#skm .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}#skm .b{padding:10px 16px;font-size:17px;font-weight:700;border-radius:12px;border:none;background:var(--c);color:#fff;cursor:pointer}#skm .b.alt{background:var(--card);color:var(--tx);border:2px solid var(--bd)}#skm .pic{font-size:84px;text-align:center;line-height:1.1;cursor:pointer;user-select:none}#skm .slots{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0;font-size:26px;font-weight:800}#skm .slot{min-width:72px;height:56px;display:inline-flex;align-items:center;justify-content:center;border:3px dashed var(--bd);border-radius:12px;background:var(--card)}#skm .slot.f1{color:var(--c);border-style:solid;border-color:var(--c)}#skm .slot.f2{color:var(--v);border-style:solid;border-color:var(--v)}#skm .word{min-width:90px;color:var(--ok)}#skm .tile{min-width:70px;height:52px;font-size:24px;font-weight:800;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}#skm .tile:disabled{opacity:.35;cursor:default}#skm .msg{text-align:center;font-size:20px;font-weight:700;min-height:28px}#skm .msg.ok{color:var(--ok)}#skm .msg.bad{color:var(--bad)}#skm .score{text-align:center;font-size:18px}#skm .note{font-size:13px;color:var(--mut);text-align:center;margin:8px 0 0}#skm .pop{animation:skmpop .5s}@keyframes skmpop{50%{transform:scale(1.25)}}</style>
<div class="tabs" role="tablist"><button type="button" class="tab" role="tab" data-t="s" aria-selected="true">🔤 Skiemenys</button><button type="button" class="tab" role="tab" data-t="w" aria-selected="false">🧩 Žodžiai</button></div>
<section data-p="s"><p class="hint">1️⃣ Pasirink <b style="color:var(--c)">priebalsį</b> &nbsp; 2️⃣ Pasirink <b style="color:var(--v)">balsį</b></p><div class="row" data-r="cons"></div><div class="row" data-r="vow"></div><div class="stage" data-r="stage"><span class="l c" data-r="lc">M</span><span class="l v" data-r="lv">A</span></div><div class="btns"><button type="button" class="b" data-a="say">🔊 Klausyk</button><button type="button" class="b alt" data-a="rand">🎲 Atsitiktinis</button></div></section>
<section data-p="w" hidden><p class="hint">Kas paveikslėlyje? Sudėk žodį iš dviejų skiemenų!</p><div class="pic" data-r="pic" title="Paspausk – išgirsi užuominą">🐱</div><div class="slots"><span class="slot" data-r="s1">?</span><span>+</span><span class="slot" data-r="s2">?</span><span>=</span><span class="word" data-r="word"></span></div><div class="row" data-r="tiles"></div><div class="msg" data-r="msg" aria-live="polite"></div><div class="btns"><button type="button" class="b alt" data-a="hint">🔊 Užuomina</button><button type="button" class="b alt" data-a="undo">↩ Iš naujo</button><button type="button" class="b" data-a="next">➡ Kitas</button></div><div class="score">⭐ <span data-r="score">0</span></div></section>
<p class="note" data-r="voice"></p>
<script>(function(){var R=document.getElementById('skm');if(!R||R.dataset.init)return;R.dataset.init='1';function q(s){return R.querySelector(s)}function r(n){return q('[data-r="'+n+'"]')}var CONS=['M','P','T','K','L','R','S','B','D','V','N','G','J','Ž','Š'],VOW=['A','E','I','O','U','Ė','Y','Ū'];var WORDS=[['MA','MA','👩'],['TĖ','TĖ','👨'],['KA','TĖ','🐱'],['LO','VA','🛏️'],['RA','SA','💧'],['RO','ŽĖ','🌹'],['LA','PĖ','🦊'],['BI','TĖ','🐝'],['MU','SĖ','🪰'],['SA','LA','🏝️'],['LĖ','LĖ','🪆'],['ŽO','LĖ','🌱'],['PU','PA','🫘'],['KĖ','DĖ','🪑'],['KO','JA','🦵'],['LU','PA','👄'],['DŪ','DA','🎺']];var lt=null,hasTTS='speechSynthesis' in window;function pickVoice(){if(!hasTTS)return;var vs=speechSynthesis.getVoices()||[];lt=null;for(var i=0;i<vs.length;i++){if(/^lt/i.test(vs[i].lang)){lt=vs[i];break}}r('voice').textContent=!hasTTS?'Šis įrenginys negali ištarti garsų – tarkite kartu su vaiku.':(lt?'Balsas: '+lt.name:'Lietuviško balso įrenginyje nerasta, todėl tarimas gali būti netikslus. Galite pridėti lietuvišką balsą įrenginio nustatymuose.')}if(hasTTS){pickVoice();speechSynthesis.addEventListener('voiceschanged',pickVoice)}else pickVoice();function say(parts,rate){if(!hasTTS)return;speechSynthesis.cancel();parts.forEach(function(t){var u=new SpeechSynthesisUtterance(t.toLowerCase());u.lang='lt-LT';if(lt)u.voice=lt;u.rate=rate||0.7;speechSynthesis.speak(u)})}var c='M',v='A';function mk(list,cls,box,on){list.forEach(function(x){var b=document.createElement('button');b.type='button';b.className='k '+cls;b.textContent=x;b.setAttribute('aria-label',x);b.addEventListener('click',function(){on(x)});box.appendChild(b)})}function mark(){R.querySelectorAll('.k.cn').forEach(function(b){b.classList.toggle('sel',b.textContent===c)});R.querySelectorAll('.k.vw').forEach(function(b){b.classList.toggle('sel',b.textContent===v)});r('lc').textContent=c;r('lv').textContent=v;r('stage').classList.remove('join')}function play(){var st=r('stage');st.classList.remove('join');void st.offsetWidth;setTimeout(function(){st.classList.add('join')},150);say([c+v,c+v],0.6)}mk(CONS,'cn',r('cons'),function(x){c=x;mark()});mk(VOW,'vw',r('vow'),function(x){v=x;mark();play()});mark();q('[data-a="say"]').addEventListener('click',play);q('[data-a="rand"]').addEventListener('click',function(){c=CONS[Math.floor(Math.random()*CONS.length)];v=VOW[Math.floor(Math.random()*VOW.length)];mark();play()});R.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){R.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-selected',x===t?'true':'false')});R.querySelectorAll('section').forEach(function(s){s.hidden=s.dataset.p!==t.dataset.t})})});var cur=null,order=[],idx=0,p1=null,p2=null,score=0,done=false,busy=false;function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}function newRound(){if(idx>=order.length||!order.length){order=shuffle(WORDS);idx=0}cur=order[idx++];p1=p2=null;done=false;busy=false;r('pic').textContent=cur[2];var pool=[];WORDS.forEach(function(w){[w[0],w[1]].forEach(function(s){if(s!==cur[0]&&s!==cur[1]&&pool.indexOf(s)<0)pool.push(s)})});var set=[cur[0]];if(cur[1]!==cur[0])set.push(cur[1]);set=set.concat(shuffle(pool).slice(0,6-set.length));renderTiles(shuffle(set));draw();msg('','')}function renderTiles(set){var box=r('tiles');box.innerHTML='';set.forEach(function(s){var b=document.createElement('button');b.type='button';b.className='tile';b.textContent=s;b.addEventListener('click',function(){pick(s)});box.appendChild(b)})}function draw(){var s1=r('s1'),s2=r('s2');s1.textContent=p1||'?';s2.textContent=p2||'?';s1.className='slot'+(p1?' f1':'');s2.className='slot'+(p2?' f2':'');r('word').textContent=done?cur[0]+cur[1]:''}function msg(t,k){var m=r('msg');m.textContent=t;m.className='msg'+(k?' '+k:'')}function pick(s){if(done||busy)return;say([s],0.6);if(!p1){p1=s}else if(!p2){p2=s}draw();if(p1&&p2)check()}function check(){if(p1===cur[0]&&p2===cur[1]){done=true;score++;r('score').textContent=score;draw();var w=r('word');w.classList.remove('pop');void w.offsetWidth;w.classList.add('pop');msg('Šaunuolis! 🎉 '+cur[0]+' + '+cur[1]+' = '+cur[0]+cur[1],'ok');say([cur[0],cur[1],cur[0]+cur[1]],0.6)}else{busy=true;msg('Pabandyk dar kartą 🙂','bad');setTimeout(function(){p1=p2=null;busy=false;draw();msg('','')},1100)}}r('pic').addEventListener('click',function(){if(cur)say([cur[0]+cur[1]],0.6)});q('[data-a="hint"]').addEventListener('click',function(){if(cur)say([cur[0],cur[1]],0.5)});q('[data-a="undo"]').addEventListener('click',function(){if(done)return;p1=p2=null;busy=false;draw();msg('','')});q('[data-a="next"]').addEventListener('click',newRound);newRound()})();</script>
</div>
</body>
